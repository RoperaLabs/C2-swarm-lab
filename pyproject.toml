[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "c2-swarm-lab"
version = "0.3.0"
description = "3-D test range for C2 algorithms of drone swarms"
license = "MIT"
authors = [{ name = "Ropera Labs" }]
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.11", "numba>=0.63"]

[project.optional-dependencies]
test = ["pytest>=8"]
grace = ["swarm-dil @ git+https://github.com/RoperaLabs/swarm-dil@289a034d9276ec2b26274e0bff024885b752f05b"]   # GRACE-3D 2.0.0 (tag v2.0.0)

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
