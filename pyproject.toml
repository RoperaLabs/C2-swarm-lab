[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "c2-swarm-lab"
version = "0.1.0.dev0"
description = "3-D test range for C2 algorithms of drone swarms"
license = "MIT"
authors = [{ name = "Ropera Labs" }]
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.11", "numba>=0.63"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
